[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-bridge-capacity-scheduler"
version = "0.1.0"
description = "Replay token-bucket bridge throughput with burst caps, refill intervals and deterministic request rejection."
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
crypto-bridge-capacity-scheduler = "cryptolab:main"

[tool.setuptools.packages.find]
include = ["cryptolab*"]

[tool.setuptools.package-data]
cryptolab = ["web/*"]
